[package]
name = "niinii"
version = "0.2.0"
authors = ["netdex <admin@netdex.org>"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
tracing-tracy = ["dep:tracing-tracy"]
tracing-chrome = ["dep:tracing-chrome"]
voicevox = ["vvcore", "rodio"]

[dependencies]
# NOTE: these dependencies should be updated all at once
# on windows, you must install freetype with vcpkg
imgui = { version = "0.12.0", features = ["tables-api", "freetype", "docking"] }
imgui-sys = { version = "0.12.0", features = ["use-vcpkg"] }
imgui-winit-support = { version = "0.12.0" }
imgui-winit-glow-renderer-viewports = "0.12.0"
glow = "0.13.1"
glutin = "0.31.3"
winit = { version = "0.29.15", features = ["rwh_05"] }
glutin-winit = "0.4.2"

# async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures = "0.3"
backon = "1.6"
arc-swap = "1.9"

# diagnostics
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tracy = { version = "0.11", optional = true }
tracing-chrome = { version = "0.7.2", optional = true }

# language support
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
fancy-regex = "0.17"
lazy_static = "1.5.0"
num-traits = "0.2"
num-derive = "0.4"
strum = "0.27"
strum_macros = "0.27"
thiserror = "2"
bitflags = "2.13"
enclose = "1.2.1"
once_cell = "1.21.4"
itertools = "0.14"

# capabilities
raw-window-handle-05 = { package = "raw-window-handle", version = "0.5.2" }
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6.2" }
copypasta = "0.10"
flate2 = { version = "1.1" }
dirs = "6.0"
rodio = { version = "0.21.1", optional = true }
nu-ansi-term = "0.50.3"

# interned
ichiran = { path = "../ichiran" }
openai = { path = "../openai" }
vndb = { path = "../vndb" }

[target.'cfg(windows)'.dependencies]
imgui-dx11-renderer = { path = "../third-party/imgui-dx11-renderer" }
vvcore = { path = "../third-party/vvcore", optional = true }

winapi = { version = "0.3", features = ["winuser"] }
wio = "0.2"

[build-dependencies]
winres = "0.1"
