[package]
name = "niinii"
version = "0.2.0"
authors = ["netdex <admin@netdex.org>"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
tracing-tracy = ["dep:tracing-tracy"]
tracing-chrome = ["dep:tracing-chrome"]
voicevox = ["vvcore", "rodio"]

[dependencies]
# NOTE: the dear-imgui crates are released together; update them all at once.
# On Windows, FreeType comes from vcpkg.
dear-imgui-rs = { version = "0.23", features = [
    "multi-viewport",
    "freetype",
    "serde",
    "system-clipboard",
] }
dear-imgui-winit = { version = "0.23", features = ["multi-viewport"] }
dear-imgui-wgpu = { version = "0.23", features = ["multi-viewport-winit"] }
dear-imgui-reflect = "0.23"
dear-file-browser = { version = "0.23", default-features = false, features = ["native-rfd"] }
wgpu = "30"
winit = "0.30.13"
pollster = "0.4"

# async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures = "0.3"
backon = "1.6"
arc-swap = "1.9"

# diagnostics
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tracy = { version = "0.11", optional = true }
tracing-chrome = { version = "0.7.2", optional = true }

# language support
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
fancy-regex = "0.17"
lazy_static = "1.5.0"
strum = "0.27"
strum_macros = "0.27"
thiserror = "2"
enclose = "1.2.1"
once_cell = "1.21.4"
itertools = "0.14"

# capabilities
flate2 = { version = "1.1" }
dirs = "6.0"
rodio = { version = "0.21.1", optional = true }
nu-ansi-term = "0.50.3"

# interned
ichiran = { path = "../ichiran" }
openai = { path = "../openai", features = ["reflect"] }
vndb = { path = "../vndb" }

[target.'cfg(windows)'.dependencies]
vvcore = { path = "../third-party/vvcore", optional = true }

winapi = { version = "0.3", features = ["windef", "winuser"] }

[dev-dependencies]
dear-imgui-test-engine = "0.23"

[build-dependencies]
winres = "0.1"
