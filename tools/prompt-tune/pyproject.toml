[project]
name = "niinii-prompt-tune"
version = "0.1.0"
description = "GEPA prompt tuning for niinii's chat translator, scored on VNTL"
requires-python = ">=3.11,<3.15"
dependencies = [
    "gepa==0.1.4",
    "sacrebleu==2.6.0",
    "httpx>=0.27",
    "pyarrow>=17",
    "tqdm>=4.66",
    "tiktoken>=0.7",
]

[project.scripts]
prompt-tune = "prompt_tune.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_tune"]
