[patch.crates-io]
# Vendored with local changes; see third-party/README.md.
dear-imgui-reflect = { path = "third-party/dear-imgui-reflect" }
dear-imgui-reflect-derive = { path = "third-party/dear-imgui-reflect-derive" }
dear-imgui-winit = { path = "third-party/dear-imgui-winit" }
wgpu-hal = { path = "third-party/wgpu-hal" }

[workspace]
members = ["niinii", "ichiran", "openai", "vndb"]
exclude = ["third-party"]
resolver = "2"

# flate2 is slow in debug mode
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
