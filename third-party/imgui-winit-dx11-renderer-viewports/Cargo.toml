[package]
name = "imgui-winit-dx11-renderer-viewports"
version = "0.12.0"
edition = "2021"
description = "Combined winit platform + Direct3D 11 renderer for imgui-rs using the docking branch multi-viewport feature"
license = "MIT"
readme = "README.md"
categories = ["gui", "rendering"]

[dependencies]
imgui = { version = "0.12.0", features = ["docking"] }
raw-window-handle = "0.6"
thiserror = "1.0.38"
winapi = { version = "0.3", features = [
    "d3d11",
    "d3dcommon",
    "dwmapi",
    "dxgi",
    "dxgiformat",
    "dxgitype",
    "minwindef",
    "windef",
    "winerror",
    "winuser",
] }
winit = "0.29.15"
wio = "0.2"

[build-dependencies]
winapi = { version = "0.3", features = ["d3dcompiler", "d3dcommon", "winerror"] }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"

# Only affects building this crate standalone (e.g. the example); dependents
# apply their own patches.
[patch.crates-io]
imgui = { git = "https://github.com/Netdex/imgui-rs", branch = "glow-viewports-mdpi" }
imgui-sys = { git = "https://github.com/Netdex/imgui-rs", branch = "glow-viewports-mdpi" }
